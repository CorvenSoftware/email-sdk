name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check, test and build the SDK
        run: pnpm turbo run check test build
      - name: Check installed-package consumers
        env:
          PACKAGE_CHECK_ALLOW_NETWORK: "1"
        run: pnpm check:package
      - name: Build documentation
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/block-documentation-fetch.ts
        run: pnpm docs:build
      - name: Save documentation artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-${{ github.sha }}
          path: docs/user/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy production documentation
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: documentation-production
      cancel-in-progress: false
    environment:
      name: docs-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download checked documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: documentation-${{ github.sha }}
          path: docs/user/dist/
      - name: Validate deployment artifact
        run: |
          for file in index.html 404.html llms.txt llms-full.txt sitemap.xml .well-known/api-catalog; do
            if [ ! -s "docs/user/dist/$file" ]; then
              printf 'Documentation artifact is missing %s.\n' "$file" >&2
              exit 1
            fi
          done
      - name: Reject superseded main commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            printf '%s\n' 'Documentation deployment refused: this commit is no longer the main branch head.' >&2
            exit 1
          fi
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            printf '%s\n' 'Documentation deployment requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the docs-production environment.' >&2
            exit 1
          fi
      - name: Deploy checked documentation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm docs:deploy --yes
